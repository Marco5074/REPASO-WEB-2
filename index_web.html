&lt;h1&gt;Teoría de JavaScript&lt;/h1&gt;
&lt;p&gt;Lee cada tema con calma y luego ve a &lt;b&gt;Tarjetas&lt;/b&gt; a evaluarte. Los recuadros amarillos son lo que más suele preguntarse.&lt;/p&gt;
&lt;nav class=&quot;idx&quot;&gt;
&lt;a href=&quot;#this&quot;&gt;this&lt;/a&gt;&lt;a href=&quot;#hoisting&quot;&gt;Hoisting&lt;/a&gt;&lt;a href=&quot;#objetos&quot;&gt;Objetos&lt;/a&gt;&lt;a href=&quot;#arrays&quot;&gt;Arrays&lt;/a&gt;&lt;a href=&quot;#desestructuracion&quot;&gt;Desestructuración&lt;/a&gt;&lt;a href=&quot;#funciones&quot;&gt;Funciones&lt;/a&gt;&lt;a href=&quot;#clases&quot;&gt;Clases&lt;/a&gt;&lt;a href=&quot;#asincronia&quot;&gt;Promesas y async&lt;/a&gt;&lt;a href=&quot;#http&quot;&gt;HTTP y HTTPS&lt;/a&gt;&lt;a href=&quot;#ecmascript&quot;&gt;ECMAScript&lt;/a&gt;
&lt;/nav&gt;

&lt;section id=&quot;this&quot;&gt;&lt;h2&gt;1. this&lt;/h2&gt;
&lt;p&gt;&lt;code&gt;this&lt;/code&gt; es una referencia al objeto que &quot;tiene&quot; el código que se está ejecutando. Su valor depende de &lt;b&gt;dónde y cómo se usa&lt;/b&gt;.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;Dentro de un método:&lt;/b&gt; es el objeto que contiene el método.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Sin objeto que lo englobe:&lt;/b&gt; es el contexto global.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Función normal:&lt;/b&gt; depende de cómo se llama: en &lt;code&gt;objeto.metodo()&lt;/code&gt;, &lt;code&gt;this&lt;/code&gt; es &lt;code&gt;objeto&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Arrow function:&lt;/b&gt; no genera su propio &lt;code&gt;this&lt;/code&gt;; usa el del ancestro más cercano que sí genere contexto.&lt;/li&gt;&lt;/ul&gt;
&lt;pre&gt;&lt;code&gt;const perro = {
  nombre: &quot;Rex&quot;,
  hablar() { console.log(this.nombre); },        // this = perro
  hablarFlecha: () =&gt; console.log(this.nombre)   // this NO es perro (hereda el de fuera)
};
perro.hablar();        // &quot;Rex&quot;
perro.hablarFlecha();  // undefined&lt;/code&gt;&lt;/pre&gt;
&lt;div class=&quot;clave&quot;&gt;Arrow function = sin &lt;code&gt;this&lt;/code&gt; propio. Por eso no conviene usarla como método de un objeto.&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;hoisting&quot;&gt;&lt;h2&gt;2. Hoisting&lt;/h2&gt;
&lt;p&gt;Comportamiento del intérprete: permite usar variables y funciones &lt;b&gt;antes de declararlas&lt;/b&gt; sin error, porque la &lt;b&gt;declaración&lt;/b&gt; &quot;se eleva&quot; a la parte más alta de su contexto. Solo se eleva la declaración, &lt;b&gt;no la asignación&lt;/b&gt;.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;console.log(miVariable);        // undefined (no da error)
var miVariable = &quot;Esto no existe&quot;;

// Así lo interpreta el motor:
var miVariable;                 // declaración elevada
console.log(miVariable);        // undefined
miVariable = &quot;Esto no existe&quot;;  // la asignación se queda aquí&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;Caso&lt;/th&gt;&lt;th&gt;Qué pasa antes de declarar&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;var&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Vale &lt;code&gt;undefined&lt;/code&gt; hasta que se le asigna valor.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;let&lt;/code&gt; / &lt;code&gt;const&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Se elevan, pero están en la &lt;b&gt;zona muerta temporal&lt;/b&gt;: usarlas antes da &lt;code&gt;ReferenceError&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;function nombre() {}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Se eleva completa: puedes llamarla antes de escribirla.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;var f = function() {}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Solo se eleva &lt;code&gt;var f&lt;/code&gt; (vale &lt;code&gt;undefined&lt;/code&gt;): llamarla antes da &lt;code&gt;TypeError&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;pre&gt;&lt;code&gt;saludar();                       // funciona
function saludar() { console.log(&quot;hola&quot;); }

otra();                          // TypeError: otra is not a function
var otra = function() {};&lt;/code&gt;&lt;/pre&gt;&lt;/section&gt;

&lt;section id=&quot;objetos&quot;&gt;&lt;h2&gt;3. Objetos y referencias&lt;/h2&gt;
&lt;p&gt;Los derivados de &lt;code&gt;Object&lt;/code&gt; (objetos, arrays, funciones...) funcionan &lt;b&gt;por referencia&lt;/b&gt;: al asignarlos, ambas variables apuntan al mismo objeto. Por eso importa la &lt;b&gt;mutabilidad&lt;/b&gt;: modificar uno cambia el original.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;const a = { n: 1 };
const b = a;        // misma referencia
b.n = 99;
console.log(a.n);   // 99 (a también cambió)

const c = structuredClone(a); // copia profunda
c.n = 5;
console.log(a.n);   // 99 (a no cambió)&lt;/code&gt;&lt;/pre&gt;
&lt;div class=&quot;clave&quot;&gt;&lt;code&gt;structuredClone()&lt;/code&gt; hace una &lt;b&gt;copia profunda&lt;/b&gt;: el resultado no comparte referencias con el original.&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;arrays&quot;&gt;&lt;h2&gt;4. Arrays y sus métodos&lt;/h2&gt;
&lt;p&gt;Un array es un &lt;b&gt;listado de elementos de cualquier tipo&lt;/b&gt;, iterable (se recorre con &lt;code&gt;for...of&lt;/code&gt;) y cuyos elementos pueden repetirse. &lt;code&gt;.length&lt;/code&gt; devuelve la cantidad de elementos.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;const frutas = [&quot;pera&quot;, &quot;uva&quot;, &quot;pera&quot;, 3, true];
for (const f of frutas) console.log(f);
console.log(frutas.length);   // 5&lt;/code&gt;&lt;/pre&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;Método&lt;/th&gt;&lt;th&gt;Qué hace&lt;/th&gt;&lt;th&gt;Ejemplo&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;Array.isArray(x)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Dice si x es un array.&lt;/td&gt;&lt;td&gt;&lt;code&gt;Array.isArray([1])&lt;/code&gt; → true&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;Array.from(it)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Crea un array a partir de un iterable.&lt;/td&gt;&lt;td&gt;&lt;code&gt;Array.from(&quot;hola&quot;)&lt;/code&gt; → [&quot;h&quot;,&quot;o&quot;,&quot;l&quot;,&quot;a&quot;]&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;Array.of(...)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Crea un array con los elementos que reciba.&lt;/td&gt;&lt;td&gt;&lt;code&gt;Array.of(3)&lt;/code&gt; → [3]&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;.push(x)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Añade al final; devuelve la nueva longitud.&lt;/td&gt;&lt;td&gt;[1,2].push(3) → 3&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;.pop()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Borra el último y lo devuelve.&lt;/td&gt;&lt;td&gt;[1,2].pop() → 2&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;.shift()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Elimina el primero y lo devuelve.&lt;/td&gt;&lt;td&gt;[1,2].shift() → 1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;.reverse()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Da la vuelta a los elementos.&lt;/td&gt;&lt;td&gt;[1,2,3] → [3,2,1]&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;.sort()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Ordena; sin función compara como &lt;b&gt;texto&lt;/b&gt; (alfabético).&lt;/td&gt;&lt;td&gt;[10,9,1].sort() → [1,10,9]&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;pre&gt;&lt;code&gt;[10, 9, 1].sort();               // [1, 10, 9]  (como texto)
[10, 9, 1].sort((a, b) =&gt; a - b); // [1, 9, 10]  (con función de comparación)&lt;/code&gt;&lt;/pre&gt;&lt;/section&gt;

&lt;section id=&quot;desestructuracion&quot;&gt;&lt;h2&gt;5. Desestructuración, spread y rest&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;Desestructurar&lt;/b&gt; es desempacar valores de arreglos o propiedades de objetos en variables distintas.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;const [x, y] = [10, 20];                 // x=10, y=20
const { nombre, edad } = { nombre: &quot;Ana&quot;, edad: 20 };&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;Los tres puntos &lt;code&gt;...&lt;/code&gt; hacen dos cosas según dónde estén:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;Spread:&lt;/b&gt; expande/copia elementos o propiedades.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Rest:&lt;/b&gt; agrupa &quot;el resto&quot; en un array u objeto.&lt;/li&gt;&lt;/ul&gt;
&lt;pre&gt;&lt;code&gt;const a = [1, 2];
const b = [...a, 3];                // spread: [1, 2, 3]
const [primero, ...resto] = b;      // rest: primero=1, resto=[2, 3]&lt;/code&gt;&lt;/pre&gt;&lt;/section&gt;

&lt;section id=&quot;funciones&quot;&gt;&lt;h2&gt;6. Funciones: callback, HOF y arrow&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;Callback:&lt;/b&gt; función que se pasa por parámetro a otra función.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Función de orden superior (HOF):&lt;/b&gt; recibe una función como parámetro o devuelve una función. Ej: &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;filter&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Arrow function:&lt;/b&gt; sintaxis corta con &lt;code&gt;=&gt;&lt;/code&gt;; no tiene su propio &lt;code&gt;this&lt;/code&gt;.&lt;/li&gt;&lt;/ul&gt;
&lt;pre&gt;&lt;code&gt;const doble = (n) =&gt; n * 2;               // arrow function
[1, 2, 3].map(doble);                     // [2, 4, 6]  (doble es el callback, map es HOF)
[1, 2, 3, 4].filter((n) =&gt; n % 2 === 0);  // [2, 4]&lt;/code&gt;&lt;/pre&gt;&lt;/section&gt;

&lt;section id=&quot;clases&quot;&gt;&lt;h2&gt;7. Clases&lt;/h2&gt;
&lt;p&gt;Una clase es una &lt;b&gt;plantilla&lt;/b&gt; para crear objetos con datos y métodos. El &lt;code&gt;constructor&lt;/code&gt; se ejecuta al usar &lt;code&gt;new&lt;/code&gt; e inicializa el objeto.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;class Persona {
  constructor(nombre) { this.nombre = nombre; }
  saludar() { return &quot;Hola, soy &quot; + this.nombre; }
}
const p = new Persona(&quot;Ana&quot;);
p.saludar();   // &quot;Hola, soy Ana&quot;&lt;/code&gt;&lt;/pre&gt;&lt;/section&gt;

&lt;section id=&quot;asincronia&quot;&gt;&lt;h2&gt;8. Promesas y programación asíncrona&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;Asíncrona:&lt;/b&gt; las tareas se ejecutan de forma independiente, sin bloquear ni esperar a que otras terminen (por ejemplo, una solicitud a un servidor).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Promesa:&lt;/b&gt; algo que se cumplirá en el futuro; representa el resultado eventual de una operación asíncrona. Estados:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;pending:&lt;/b&gt; pendiente, aún sin resultado.&lt;/li&gt;&lt;li&gt;&lt;b&gt;fulfilled:&lt;/b&gt; cumplida/resuelta con éxito.&lt;/li&gt;&lt;li&gt;&lt;b&gt;rejected:&lt;/b&gt; rechazada por un error.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;code&gt;async&lt;/code&gt; marca una función asíncrona (devuelve una promesa); &lt;code&gt;await&lt;/code&gt; pausa dentro de ella hasta que la promesa se resuelva.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;async function traerDatos() {
  try {
    const resp = await fetch(&quot;https://api.ejemplo.com/datos&quot;);
    return await resp.json();
  } catch (e) {
    console.log(&quot;falló:&quot;, e);
  }
}&lt;/code&gt;&lt;/pre&gt;&lt;/section&gt;

&lt;section id=&quot;http&quot;&gt;&lt;h2&gt;9. HTTP, HTTPS y códigos de estado&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;HTTP&lt;/b&gt; es un protocolo (conjunto de reglas) de comunicación cliente-servidor: el navegador envía una &lt;b&gt;solicitud&lt;/b&gt; y el servidor responde.&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;code&gt;GET&lt;/code&gt;: obtener datos. &lt;code&gt;POST&lt;/code&gt;: enviar datos. &lt;code&gt;PUT&lt;/code&gt;: reemplazar o actualizar.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;b&gt;HTTPS&lt;/b&gt; es la versión segura: HTTP envía datos sin cifrar (pueden ser interceptados); HTTPS establece una conexión cifrada antes de transferir datos. La seguridad la da &lt;b&gt;TLS&lt;/b&gt; (antes, &lt;b&gt;SSL&lt;/b&gt;).&lt;/p&gt;
&lt;h3&gt;Cómo funciona HTTPS, paso a paso&lt;/h3&gt;
&lt;ol&gt;&lt;li&gt;El navegador pide el &lt;b&gt;certificado&lt;/b&gt; al servidor.&lt;/li&gt;&lt;li&gt;El servidor lo envía con su &lt;b&gt;clave pública&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;El navegador verifica el certificado y cifra una &lt;b&gt;clave de sesión&lt;/b&gt; con esa clave pública.&lt;/li&gt;&lt;li&gt;El servidor la descifra con su &lt;b&gt;clave privada&lt;/b&gt; y confirma.&lt;/li&gt;&lt;li&gt;Desde ahí, todo se cifra con la clave de sesión.&lt;/li&gt;&lt;/ol&gt;
&lt;h3&gt;Códigos de estado&lt;/h3&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;Rango&lt;/th&gt;&lt;th&gt;Significado&lt;/th&gt;&lt;th&gt;Ejemplos&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1xx&lt;/td&gt;&lt;td&gt;Informativo&lt;/td&gt;&lt;td&gt;100 Continue&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2xx&lt;/td&gt;&lt;td&gt;Salió bien&lt;/td&gt;&lt;td&gt;200 OK, 201 Created, 204 No Content&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3xx&lt;/td&gt;&lt;td&gt;Redirección&lt;/td&gt;&lt;td&gt;301 Moved Permanently, 304 Not Modified&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4xx&lt;/td&gt;&lt;td&gt;Error del cliente&lt;/td&gt;&lt;td&gt;400 Bad Request, 401 Unauthorized, 403 Forbidden, &lt;b&gt;404 Not Found&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5xx&lt;/td&gt;&lt;td&gt;Error del servidor&lt;/td&gt;&lt;td&gt;&lt;b&gt;500 Internal Server Error&lt;/b&gt;, 503 Service Unavailable&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p&gt;Para practicar los códigos uno por uno, usa la pestaña &lt;b&gt;Gatos HTTP&lt;/b&gt;.&lt;/p&gt;&lt;/section&gt;

&lt;section id=&quot;ecmascript&quot;&gt;&lt;h2&gt;10. ECMAScript, versiones y crossbrowser&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;ECMAScript&lt;/b&gt; es la especificación o estándar en la que se basa JavaScript. Define cómo debe funcionar JS para que los motores de los distintos navegadores hagan que el mismo código funcione igual. El número es la &lt;b&gt;versión&lt;/b&gt;; cada una añade funcionalidades. Desde 2015 se recomienda nombrarlas por &lt;b&gt;año&lt;/b&gt; (ECMAScript 2015, no ES6).&lt;/p&gt;
&lt;p&gt;Ningún navegador la cumple al 100 %: hay discrepancias, y una característica puede funcionar en uno y en otro no. La tabla de compatibilidad &lt;b&gt;Kangax&lt;/b&gt; muestra qué porcentaje de cada versión cumple cada navegador.&lt;/p&gt;
&lt;h3&gt;Versiones y novedades&lt;/h3&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;Versión&lt;/th&gt;&lt;th&gt;Novedades&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;ES3 (1999)&lt;/td&gt;&lt;td&gt;Expresiones regulares (RegExp), try/catch&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;ES4 (2008)&lt;/td&gt;&lt;td&gt;Versión abandonada&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;ES5 (2009)&lt;/td&gt;&lt;td&gt;Strict mode, JSON&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;ES6 / 2015&lt;/td&gt;&lt;td&gt;Clases, módulos, Map, Set, for of, proxies&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;ES2016&lt;/td&gt;&lt;td&gt;&lt;code&gt;includes()&lt;/code&gt;, operador &lt;code&gt;**&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;ES2017&lt;/td&gt;&lt;td&gt;&lt;code&gt;async/await&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;ES2018&lt;/td&gt;&lt;td&gt;Rest/spread, &lt;code&gt;Promise.finally()&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;

&lt;h3&gt;Las 4 estrategias crossbrowser&lt;/h3&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;Enfoque&lt;/th&gt;&lt;th&gt;En qué consiste&lt;/th&gt;&lt;th&gt;Pro / Contra&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Conservador&lt;/td&gt;&lt;td&gt;Escribir en una versión ECMAScript antigua.&lt;/td&gt;&lt;td&gt;+ Compatible con casi todo, sin herramientas. − Más código y sin las novedades.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Delegador&lt;/td&gt;&lt;td&gt;Dejar la compatibilidad a un framework o librería.&lt;/td&gt;&lt;td&gt;+ Cómodo y transparente. − Dependencia; pierdes rendimiento y control.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Evergreen&lt;/td&gt;&lt;td&gt;Dar soporte solo a las últimas versiones de los navegadores.&lt;/td&gt;&lt;td&gt;+ Cómodo si puedes obligar a actualizar. − No funciona en navegadores antiguos.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Transpilador&lt;/td&gt;&lt;td&gt;Escribes en la última versión y una herramienta la convierte a versiones antiguas.&lt;/td&gt;&lt;td&gt;+ Código moderno y compatible. − Más complejo, requiere configuración; editas los originales, no los transpilados.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;Transpilar:&lt;/b&gt; convertir, con una herramienta, código reciente a versiones antiguas.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Polyfill:&lt;/b&gt; librería o código que hace de parche para dar una característica que el navegador aún no tiene.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Fallback:&lt;/b&gt; código alternativo para cuando algo no funciona.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;

  [&quot;Crossbrowser&quot;, &quot;¿Cuáles son las 4 estrategias «crossbrowser» para que el código funcione en todos los navegadores?&quot;, &quot;Conservador, delegador, evergreen y transpilador.&quot;, [[&quot;conservador&quot;], [&quot;delegador&quot;], [&quot;evergreen&quot;], [&quot;transpilador&quot;]]],
  [&quot;Crossbrowser&quot;, &quot;Enfoque conservador: ¿en qué consiste y qué pros y contras tiene?&quot;, &quot;Escribir código en una versión ECMAScript antigua («ignoras los problemas y escribes código viejo»). Pro: compatible con la mayoría de navegadores y sin herramientas externas. Contra: mucho código para ciertas tareas y sin las novedades de JS.&quot;, [[&quot;antigua&quot;, &quot;vieja&quot;, &quot;viejo&quot;, &quot;antiguo&quot;], [&quot;compatible&quot;, &quot;mayoria&quot;, &quot;navegadores&quot;], [&quot;mas codigo&quot;, &quot;mucho codigo&quot;, &quot;novedades&quot;, &quot;no podra&quot;]]],

  [&quot;Crossbrowser&quot;, &quot;Enfoque evergreen: ¿en qué consiste y qué pros y contras tiene?&quot;, &quot;Dar soporte solo a las últimas versiones de los navegadores («si no usas este navegador, no es mi problema»). Pro: cómodo, ideal si puedes obligar a actualizar. Contra: no funcionará a usuarios con navegadores antiguos.&quot;, [[&quot;ultimas&quot;, &quot;recientes&quot;, &quot;actualiz&quot;, &quot;evergreen&quot;], [&quot;soporte&quot;, &quot;compatib&quot;, &quot;solo&quot;, &quot;unicamente&quot;], [&quot;antiguos&quot;, &quot;viejos&quot;, &quot;no funcionara&quot;, &quot;no funciona&quot;]]],
  [&quot;Crossbrowser&quot;, &quot;Enfoque transpilador: ¿en qué consiste y qué pros y contras tiene?&quot;, &quot;Escribes en la última versión de ECMAScript y una herramienta lo convierte a versiones antiguas. Pro: código moderno compatible en todos lados. Contra: más complejo, requiere configuración y debes editar los originales, no los transpilados.&quot;, [[&quot;ultima&quot;, &quot;moderno&quot;, &quot;reciente&quot;], [&quot;herramienta&quot;, &quot;convierte&quot;, &quot;transpila&quot;], [&quot;antigua&quot;, &quot;antiguas&quot;, &quot;viejas&quot;, &quot;compatible&quot;]]],

  [&quot;Crossbrowser&quot;, &quot;¿Qué es un fallback?&quot;, &quot;Un fragmento de código preparado para ofrecer una alternativa en caso de que algo no entre en funcionamiento.&quot;, [[&quot;alternativa&quot;, &quot;plan b&quot;, &quot;respaldo&quot;], [&quot;no funciona&quot;, &quot;no entra&quot;, &quot;falla&quot;, &quot;error&quot;]]],

const $ = (s) =&gt; document.querySelector(s);
const barajar = (l) =&gt; [...l].sort(() =&gt; Math.random() - 0.5);
const limpiar = (t) =&gt; t.toLowerCase().normalize(&quot;NFD&quot;).replace(/[\u0300-\u036f]/g, &quot;&quot;);
// Devuelve las ideas clave que aparecen en el texto del usuario.
const acertadas = (texto, claves) =&gt; claves.filter((alts) =&gt; alts.some((a) =&gt; texto.includes(limpiar(a))));

let cola = barajar(TARJETAS);
let dominadas = 0, intentos = 0, resuelta = false;

function aviso(texto, tipo) {
  const m = $(&quot;#msg&quot;);
  m.className = tipo;
  m.textContent = texto;
}

function mostrar() {
  resuelta = false;
  $(&quot;#progreso&quot;).textContent = `Dominadas ${dominadas} de ${TARJETAS.length}. Intentos: ${intentos}`;
  $(&quot;#avance&quot;).style.width = `${(dominadas / TARJETAS.length) * 100}%`;
  $(&quot;#msg&quot;).className = &quot;&quot;;
  $(&quot;#comprobar&quot;).textContent = &quot;Comprobar&quot;;
  $(&quot;#respuesta&quot;).value = &quot;&quot;;
  $(&quot;#respuesta&quot;).disabled = false;

  if (cola.length === 0) {
    $(&quot;#tema&quot;).textContent = &quot;¡Listo!&quot;;
    $(&quot;#pregunta&quot;).textContent = `Dominaste las ${TARJETAS.length} tarjetas con ${intentos} intentos.`;
    $(&quot;#comprobar&quot;).textContent = &quot;Empezar de nuevo&quot;;
    $(&quot;#respuesta&quot;).disabled = true;
    resuelta = true;
    cola = barajar(TARJETAS); dominadas = 0; intentos = 0;
    return;
  }
  const [tema, pregunta] = cola[0]; // desestructuración de array
  $(&quot;#tema&quot;).textContent = tema;
  $(&quot;#pregunta&quot;).textContent = pregunta;
  $(&quot;#respuesta&quot;).focus();
}

function comprobar() {
  if (resuelta) return mostrar();
  const texto = limpiar($(&quot;#respuesta&quot;).value.trim());
  if (!texto) return aviso(&quot;Escribe algo primero.&quot;, &quot;info&quot;);

  const [, , modelo, claves] = cola[0];
  const aciertos = acertadas(texto, claves);
  intentos++;

  if (aciertos.length &gt;= Math.ceil(claves.length * 0.6)) {
    aviso(`Correcto. Respuesta modelo: ${modelo}`, &quot;ok&quot;);
    cola.shift();          // sale de la cola: ya la dominas
    dominadas++;
    terminarTarjeta();
  } else {
    aviso(`Error: tienes ${aciertos.length} de ${claves.length} ideas clave. Escribe de nuevo.`, &quot;mal&quot;);
    $(&quot;#respuesta&quot;).value = &quot;&quot;;
    $(&quot;#respuesta&quot;).focus();
  }
}

function verRespuesta() {
  if (resuelta) return;
  const [, , modelo] = cola[0];
  aviso(`Respuesta: ${modelo} (esta tarjeta volverá a salir)`, &quot;info&quot;);
  cola.push(cola.shift()); // al final de la cola: la repites después
  terminarTarjeta();
}

function terminarTarjeta() {
  resuelta = true;
  $(&quot;#respuesta&quot;).disabled = true;
  $(&quot;#comprobar&quot;).textContent = &quot;Siguiente&quot;;
  $(&quot;#comprobar&quot;).focus();
  $(&quot;#progreso&quot;).textContent = `Dominadas ${dominadas} de ${TARJETAS.length}. Intentos: ${intentos}`;
  $(&quot;#avance&quot;).style.width = `${(dominadas / TARJETAS.length) * 100}%`;
}

function pista() {
  if (resuelta) return;
  const texto = limpiar($(&quot;#respuesta&quot;).value);
  const [, , , claves] = cola[0];
  const faltan = claves.filter((alts) =&gt; !alts.some((a) =&gt; texto.includes(limpiar(a))));
  aviso(faltan.length ? `Pista: te falta mencionar algo relacionado con &quot;${faltan[0][0]}&quot;.` : &quot;Ya tienes todas las ideas, pulsa Comprobar.&quot;, &quot;info&quot;);
}

$(&quot;#comprobar&quot;).addEventListener(&quot;click&quot;, comprobar);
$(&quot;#ver&quot;).addEventListener(&quot;click&quot;, verRespuesta);
$(&quot;#pista&quot;).addEventListener(&quot;click&quot;, pista);
$(&quot;#respuesta&quot;).addEventListener(&quot;keydown&quot;, (e) =&gt; {
  if (e.key === &quot;Enter&quot; &amp;&amp; !e.shiftKey) { e.preventDefault(); comprobar(); }
});

mostrar();

  #preguntas;

  // [1] Parámetro por defecto: si no pasas &quot;total&quot;, vale 5.
  constructor(datos, total = 10) {

    this.#preguntas = barajar(structuredClone(datos)).slice(0, total);

  get actual()    { return this.#preguntas[this.#ronda]; }
  get terminado() { return this.#ronda &gt;= this.#preguntas.length; }
  get estado()    { return { puntos: this.#puntos, ronda: this.#ronda + 1, total: this.#preguntas.length }; }

    if (acierto) this.#puntos++;

  }

function fin() {
  const { puntos, total } = juego.estado;

  $(&quot;#pregunta&quot;).textContent = `Terminaste con ${puntos} de ${total}.`;

  $(&quot;#gato&quot;).hidden = true;

  otra.textContent = &quot;Jugar otra vez&quot;;
  otra.hidden = false;
  otra.onclick = () =&gt; location.reload();
}

$(&quot;#siguiente&quot;).onclick = () =&gt; { juego.avanzar(); mostrarRonda(); };

  if (resuelta) return;
  const r = cola[0][1][0]; pistas++;
  aviso(pistas === 1 ? `Pista: tiene ${r.length} caracteres y empieza con «${r[0]}».` : `Pista: empieza con «${r.slice(0, Math.min(pistas + 1, r.length - 1))}».`, &quot;info&quot;);
}
function ver() {
  if (resuelta) return;
  aviso(`Respuesta: ${cola[0][1][0]} (esta tarjeta volverá a salir)`, &quot;info&quot;);
  cola.push(cola.shift()); terminar();
}
$(&quot;#comprobar&quot;).addEventListener(&quot;click&quot;, comprobar);
$(&quot;#pista&quot;).addEventListener(&quot;click&quot;, pista);
$(&quot;#ver&quot;).addEventListener(&quot;click&quot;, ver);
$(&quot;#resp&quot;).addEventListener(&quot;keydown&quot;, (e) =&gt; { if (e.key === &quot;Enter&quot;) { e.preventDefault(); comprobar(); } });
mostrar();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;
