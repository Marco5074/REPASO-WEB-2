  [&quot;Crossbrowser&quot;, &quot;¿Cuáles son las 4 estrategias «crossbrowser» para que el código funcione en todos los navegadores?&quot;, &quot;Conservador, delegador, evergreen y transpilador.&quot;, [[&quot;conservador&quot;], [&quot;delegador&quot;], [&quot;evergreen&quot;], [&quot;transpilador&quot;]]],
  [&quot;Crossbrowser&quot;, &quot;Enfoque conservador: ¿en qué consiste y qué pros y contras tiene?&quot;, &quot;Escribir código en una versión ECMAScript antigua («ignoras los problemas y escribes código viejo»). Pro: compatible con la mayoría de navegadores y sin herramientas externas. Contra: mucho código para ciertas tareas y sin las novedades de JS.&quot;, [[&quot;antigua&quot;, &quot;vieja&quot;, &quot;viejo&quot;, &quot;antiguo&quot;], [&quot;compatible&quot;, &quot;mayoria&quot;, &quot;navegadores&quot;], [&quot;mas codigo&quot;, &quot;mucho codigo&quot;, &quot;novedades&quot;, &quot;no podra&quot;]]],
  [&quot;Crossbrowser&quot;, &quot;Enfoque delegador: ¿en qué consiste y qué pros y contras tiene?&quot;, &quot;Delegar la compatibilidad en un framework o librería («te despreocupas y confías en que lo hará bien»). Pro: cómodo y transparente. Contra: el framework es una dependencia y se pierde algo de rendimiento y control.&quot;, [[&quot;framework&quot;, &quot;libreria&quot;], [&quot;delega&quot;, &quot;despreocupa&quot;, &quot;confia&quot;], [&quot;dependencia&quot;, &quot;rendimiento&quot;, &quot;control&quot;]]],
  [&quot;Crossbrowser&quot;, &quot;Enfoque evergreen: ¿en qué consiste y qué pros y contras tiene?&quot;, &quot;Dar soporte solo a las últimas versiones de los navegadores («si no usas este navegador, no es mi problema»). Pro: cómodo, ideal si puedes obligar a actualizar. Contra: no funcionará a usuarios con navegadores antiguos.&quot;, [[&quot;ultimas&quot;, &quot;recientes&quot;, &quot;actualiz&quot;, &quot;evergreen&quot;], [&quot;soporte&quot;, &quot;compatib&quot;, &quot;solo&quot;, &quot;unicamente&quot;], [&quot;antiguos&quot;, &quot;viejos&quot;, &quot;no funcionara&quot;, &quot;no funciona&quot;]]],
  [&quot;Crossbrowser&quot;, &quot;Enfoque transpilador: ¿en qué consiste y qué pros y contras tiene?&quot;, &quot;Escribes en la última versión de ECMAScript y una herramienta lo convierte a versiones antiguas. Pro: código moderno compatible en todos lados. Contra: más complejo, requiere configuración y debes editar los originales, no los transpilados.&quot;, [[&quot;ultima&quot;, &quot;moderno&quot;, &quot;reciente&quot;], [&quot;herramienta&quot;, &quot;convierte&quot;, &quot;transpila&quot;], [&quot;antigua&quot;, &quot;antiguas&quot;, &quot;viejas&quot;, &quot;compatible&quot;]]],

  [&quot;Crossbrowser&quot;, &quot;¿Qué es un fallback?&quot;, &quot;Un fragmento de código preparado para ofrecer una alternativa en caso de que algo no entre en funcionamiento.&quot;, [[&quot;alternativa&quot;, &quot;plan b&quot;, &quot;respaldo&quot;], [&quot;no funciona&quot;, &quot;no entra&quot;, &quot;falla&quot;, &quot;error&quot;]]],

const $ = (s) =&gt; document.querySelector(s);
const barajar = (l) =&gt; [...l].sort(() =&gt; Math.random() - 0.5);
const limpiar = (t) =&gt; t.toLowerCase().normalize(&quot;NFD&quot;).replace(/[\u0300-\u036f]/g, &quot;&quot;);
// Devuelve las ideas clave que aparecen en el texto del usuario.
const acertadas = (texto, claves) =&gt; claves.filter((alts) =&gt; alts.some((a) =&gt; texto.includes(limpiar(a))));

let cola = barajar(TARJETAS);
let dominadas = 0, intentos = 0, resuelta = false;

function aviso(texto, tipo) {
  const m = $(&quot;#msg&quot;);
  m.className = tipo;
  m.textContent = texto;
}

function mostrar() {
  resuelta = false;
  $(&quot;#progreso&quot;).textContent = `Dominadas ${dominadas} de ${TARJETAS.length}. Intentos: ${intentos}`;
  $(&quot;#avance&quot;).style.width = `${(dominadas / TARJETAS.length) * 100}%`;
  $(&quot;#msg&quot;).className = &quot;&quot;;
  $(&quot;#comprobar&quot;).textContent = &quot;Comprobar&quot;;
  $(&quot;#respuesta&quot;).value = &quot;&quot;;
  $(&quot;#respuesta&quot;).disabled = false;

  if (cola.length === 0) {
    $(&quot;#tema&quot;).textContent = &quot;¡Listo!&quot;;
    $(&quot;#pregunta&quot;).textContent = `Dominaste las ${TARJETAS.length} tarjetas con ${intentos} intentos.`;
    $(&quot;#comprobar&quot;).textContent = &quot;Empezar de nuevo&quot;;
    $(&quot;#respuesta&quot;).disabled = true;
    resuelta = true;
    cola = barajar(TARJETAS); dominadas = 0; intentos = 0;
    return;
  }
  const [tema, pregunta] = cola[0]; // desestructuración de array
  $(&quot;#tema&quot;).textContent = tema;
  $(&quot;#pregunta&quot;).textContent = pregunta;
  $(&quot;#respuesta&quot;).focus();
}

function comprobar() {
  if (resuelta) return mostrar();
  const texto = limpiar($(&quot;#respuesta&quot;).value.trim());
  if (!texto) return aviso(&quot;Escribe algo primero.&quot;, &quot;info&quot;);

  const [, , modelo, claves] = cola[0];
  const aciertos = acertadas(texto, claves);
  intentos++;

  if (aciertos.length &gt;= Math.ceil(claves.length * 0.6)) {
    aviso(`Correcto. Respuesta modelo: ${modelo}`, &quot;ok&quot;);
    cola.shift();          // sale de la cola: ya la dominas
    dominadas++;
    terminarTarjeta();
  } else {
    aviso(`Error: tienes ${aciertos.length} de ${claves.length} ideas clave. Escribe de nuevo.`, &quot;mal&quot;);
    $(&quot;#respuesta&quot;).value = &quot;&quot;;
    $(&quot;#respuesta&quot;).focus();
  }
}

function verRespuesta() {
  if (resuelta) return;
  const [, , modelo] = cola[0];
  aviso(`Respuesta: ${modelo} (esta tarjeta volverá a salir)`, &quot;info&quot;);
  cola.push(cola.shift()); // al final de la cola: la repites después
  terminarTarjeta();
}

function terminarTarjeta() {
  resuelta = true;
  $(&quot;#respuesta&quot;).disabled = true;
  $(&quot;#comprobar&quot;).textContent = &quot;Siguiente&quot;;
  $(&quot;#comprobar&quot;).focus();
  $(&quot;#progreso&quot;).textContent = `Dominadas ${dominadas} de ${TARJETAS.length}. Intentos: ${intentos}`;
  $(&quot;#avance&quot;).style.width = `${(dominadas / TARJETAS.length) * 100}%`;
}

function pista() {
  if (resuelta) return;
  const texto = limpiar($(&quot;#respuesta&quot;).value);
  const [, , , claves] = cola[0];
  const faltan = claves.filter((alts) =&gt; !alts.some((a) =&gt; texto.includes(limpiar(a))));
  aviso(faltan.length ? `Pista: te falta mencionar algo relacionado con &quot;${faltan[0][0]}&quot;.` : &quot;Ya tienes todas las ideas, pulsa Comprobar.&quot;, &quot;info&quot;);
}

$(&quot;#comprobar&quot;).addEventListener(&quot;click&quot;, comprobar);
$(&quot;#ver&quot;).addEventListener(&quot;click&quot;, verRespuesta);
$(&quot;#pista&quot;).addEventListener(&quot;click&quot;, pista);
$(&quot;#respuesta&quot;).addEventListener(&quot;keydown&quot;, (e) =&gt; {
  if (e.key === &quot;Enter&quot; &amp;&amp; !e.shiftKey) { e.preventDefault(); comprobar(); }
});

mostrar();

  { code: 503, text: &quot;Service Unavailable&quot;, pista: &quot;El servidor no puede atender ahora mismo.&quot; },
  { code: 504, text: &quot;Gateway Timeout&quot;, pista: &quot;Un servidor intermedio no recibió respuesta a tiempo del servidor de origen.&quot; },
  { code: 506, text: &quot;Variant Also Negotiates&quot;, pista: &quot;Error de configuración en la negociación de contenido.&quot; },
  { code: 507, text: &quot;Insufficient Storage&quot;, pista: &quot;El servidor no tiene espacio para guardar la petición.&quot; },
  { code: 508, text: &quot;Loop Detected&quot;, pista: &quot;El servidor detectó un bucle infinito.&quot; },
  { code: 509, text: &quot;Bandwidth Limit Exceeded&quot;, pista: &quot;El sitio superó el ancho de banda permitido.&quot; },
  { code: 510, text: &quot;Not Extended&quot;, pista: &quot;Faltan extensiones que el servidor exige.&quot; },
  { code: 511, text: &quot;Network Authentication Required&quot;, pista: &quot;Debes autenticarte en la red (como el portal de un wifi público).&quot; },
  { code: 521, text: &quot;Web Server Is Down&quot;, pista: &quot;Cloudflare: el servidor de origen rechazó la conexión.&quot; },
  { code: 522, text: &quot;Connection Timed Out&quot;, pista: &quot;Cloudflare: se agotó el tiempo conectando con el servidor de origen.&quot; },
  { code: 523, text: &quot;Origin Is Unreachable&quot;, pista: &quot;Cloudflare: no se puede llegar al servidor de origen.&quot; },
  { code: 525, text: &quot;SSL Handshake Failed&quot;, pista: &quot;Cloudflare: falló el apretón de manos SSL con el origen.&quot; },
  { code: 530, text: &quot;Site Frozen&quot;, pista: &quot;El sitio fue congelado o suspendido (por ejemplo, por falta de pago).&quot; },
  { code: 599, text: &quot;Network Connect Timeout Error&quot;, pista: &quot;Se agotó el tiempo de conexión de red (código no oficial).&quot; },
];

// [4] ARROW FUNCTION + [3] CALLBACK: sort() recibe una función que decide el orden.
// [6] Spread (...) copia el array para no modificar el original.
const barajar = (lista) =&gt; [...lista].sort(() =&gt; Math.random() - 0.5);

// [4] Arrow function corta: atajo para buscar elementos del DOM.
const $ = (selector) =&gt; document.querySelector(selector);

// [2] CLASE: agrupa datos (estado) y comportamiento (métodos).
class Juego {
  // [6] Campos privados (#): solo accesibles dentro de la clase.
  #puntos = 0;
  #ronda = 0;
  #preguntas;

  // [2] El constructor se ejecuta con &quot;new Juego(...)&quot;.
  // [1] Parámetro por defecto: si no pasas &quot;total&quot;, vale 5.
  constructor(datos, total = 10) {
    // [6] structuredClone: copia profunda (no comparte referencias con CODIGOS).
    this.#preguntas = barajar(structuredClone(datos)).slice(0, total);
  }

  // [2] Getters: se usan como propiedades (juego.actual), sin paréntesis.
  get actual()    { return this.#preguntas[this.#ronda]; }
  get terminado() { return this.#ronda &gt;= this.#preguntas.length; }
  get estado()    { return { puntos: this.#puntos, ronda: this.#ronda + 1, total: this.#preguntas.length }; }

  opciones(todos) {
    // [1] Desestructuración: sacamos &quot;code&quot; del objeto actual.
    const { code } = this.actual;
    // [3] HOF: filter recibe un callback que decide qué elementos se quedan.
    const distractores = barajar(todos.filter((d) =&gt; d.code !== code)).slice(0, 3);
    return barajar([this.actual, ...distractores]);
  }

  responder(codigo) {
    const acierto = codigo === this.actual.code;
    if (acierto) this.#puntos++;
    return acierto;
  }

  avanzar() { this.#ronda++; }
}

const juego = new Juego(CODIGOS);

// [3] CALLBACK: &quot;alElegir&quot; es una función que nos pasan y llamamos más tarde.
function crearBotones(opciones, alElegir) {
  // [3] HOF: map transforma cada opción en un &lt;button&gt;.
  // [1] Desestructuración en el parámetro: ({ code }) en vez de (opcion) =&gt; opcion.code
  const botones = opciones.map(({ code, pista }) =&gt; {
    const boton = document.createElement(&quot;button&quot;);
    boton.textContent = pista;
    boton.dataset.code = code;
    boton.addEventListener(&quot;click&quot;, () =&gt; alElegir(code, boton));
    return boton;
  });
  $(&quot;#opciones&quot;).replaceChildren(...botones);
}

function mostrarRonda() {
  if (juego.terminado) return fin();

  // [1] Desestructuración con varias propiedades a la vez.
  const { puntos, ronda, total } = juego.estado;
  const { code } = juego.actual;

  $(&quot;#marcador&quot;).textContent = `Ronda ${ronda} de ${total}, ${puntos} puntos`;
  $(&quot;#numero&quot;).textContent = code;
  $(&quot;#pregunta&quot;).textContent = &quot;¿Qué significa este código HTTP?&quot;;
  $(&quot;#gato&quot;).hidden = true;
  $(&quot;#siguiente&quot;).hidden = true;

  crearBotones(juego.opciones(CODIGOS), (codigo, boton) =&gt; {
    // [1] Desestructuración + renombrado: &quot;code&quot; pasa a llamarse &quot;correcto&quot;.
    const { code: correcto, text } = juego.actual;
    const acierto = juego.responder(codigo);
    boton.classList.add(acierto ? &quot;ok&quot; : &quot;mal&quot;);

    // [3] HOF: forEach ejecuta el callback con cada botón.
    document.querySelectorAll(&quot;#opciones button&quot;).forEach((b) =&gt; {
      b.disabled = true;
      if (Number(b.dataset.code) === correcto) b.classList.add(&quot;ok&quot;);
    });
    $(&quot;#gato figcaption&quot;).textContent = `${correcto} ${text}`;
    $(&quot;#gato&quot;).hidden = false;
    $(&quot;#siguiente&quot;).hidden = false;
  });
}

function fin() {
  const { puntos, total } = juego.estado;

  // [6] Nullish coalescing (??): usa 0 solo si no hay valor guardado (null/undefined).
  // [6] Optional chaining (?.): no falla si &quot;localStorage&quot; no existe.
  const anterior = Number(globalThis.localStorage?.getItem(&quot;mejor&quot;) ?? 0);
  const mejor = Math.max(anterior, puntos);
  globalThis.localStorage?.setItem(&quot;mejor&quot;, mejor);

  $(&quot;#marcador&quot;).textContent = `Mejor marca: ${mejor}`;
  $(&quot;#pregunta&quot;).textContent = `Terminaste con ${puntos} de ${total}.`;
  $(&quot;#opciones&quot;).replaceChildren();
  $(&quot;#gato&quot;).hidden = true;

  const otra = $(&quot;#siguiente&quot;);
  otra.textContent = &quot;Jugar otra vez&quot;;
  otra.hidden = false;
  otra.onclick = () =&gt; location.reload();
}

$(&quot;#siguiente&quot;).onclick = () =&gt; { juego.avanzar(); mostrarRonda(); };

mostrarRonda();
&lt;/script&gt;
&lt;/body&gt;

  document.querySelectorAll("nav button").forEach((x) => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("iframe").forEach((f) => f.classList.toggle("activo", f.id === b.dataset.f));
}));
</script>
